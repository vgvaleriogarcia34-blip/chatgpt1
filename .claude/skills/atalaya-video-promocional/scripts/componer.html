<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Compositor del vídeo promocional</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Libre+Franklin:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  /* Lienzo fijo de 1920×1080: cada fotograma se dibuja aquí con window.seek(t) */
  html, body { margin: 0; background: #05070b; overflow: hidden; }
  #lienzo { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #05070b; font-family: 'Libre Franklin', 'DejaVu Sans', sans-serif; color: #f2efe8; }
  .capa { position: absolute; inset: 0; overflow: hidden; }
  .capa img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; will-change: transform; }
  .velo { position: absolute; inset: 0; pointer-events: none; }
  .foco { position: absolute; border: 4px solid var(--acento); border-radius: 14px; box-shadow: 0 0 0 9999px rgba(3, 5, 9, 0.62), 0 0 40px rgba(201, 242, 77, 0.35); }
  .viñeta { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.55) 100%); }
  .etiqueta { position: absolute; left: 72px; top: 64px; padding: 10px 20px; border-radius: 999px; background: rgba(5, 7, 11, 0.82); border: 1.5px solid var(--acento); color: var(--acento); font: 600 26px 'IBM Plex Mono', monospace; letter-spacing: 0.06em; text-transform: uppercase; }
  .rotulo { position: absolute; left: 72px; bottom: 170px; max-width: 1300px; font: 800 78px/1.04 'Archivo', sans-serif; letter-spacing: -0.02em; text-shadow: 0 6px 40px rgba(0, 0, 0, 0.85); }
  .rotulo span { display: inline-block; margin-right: 0.24em; }
  .rotulo .ac { color: var(--acento); }
  .rotulo-fondo { position: absolute; left: 0; right: 0; bottom: 0; height: 520px; background: linear-gradient(180deg, transparent, rgba(3, 5, 9, 0.88)); }
  .bug { position: absolute; right: 64px; top: 58px; font: 700 28px 'Archivo', sans-serif; color: rgba(242, 239, 232, 0.9); letter-spacing: -0.01em; }
  .bug i { color: var(--acento); font-style: normal; }
  .sub { position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%); max-width: 1500px; padding: 12px 26px; border-radius: 12px; background: rgba(3, 5, 9, 0.78); font: 500 38px/1.3 'Libre Franklin', sans-serif; text-align: center; color: #fff; }
  .tarjeta { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; background: radial-gradient(ellipse at 50% 40%, #121a28 0%, #05070b 70%); }
  .tarjeta h1 { margin: 0; font: 800 132px/1.0 'Archivo', sans-serif; letter-spacing: -0.035em; }
  .tarjeta h1 .ac { color: var(--acento); }
  .tarjeta p { margin: 28px auto 0; max-width: 1300px; font: 400 40px/1.35 'Libre Franklin', sans-serif; color: rgba(242, 239, 232, 0.8); }
  .tarjeta .kick { font: 600 28px 'IBM Plex Mono', monospace; letter-spacing: 0.12em; text-transform: uppercase; color: var(--acento); margin-bottom: 26px; }
  .cifra { display: flex; align-items: center; justify-content: center; gap: 60px; }
  .cifra b { font: 800 150px/1 'Archivo', sans-serif; letter-spacing: -0.04em; }
  .cifra .de { color: #ff7b6b; } .cifra .a { color: #9be89b; } .cifra .fl { font: 400 90px 'Archivo', sans-serif; color: rgba(242, 239, 232, 0.5); }
  .cta { display: inline-block; margin-top: 46px; padding: 22px 46px; border-radius: 999px; background: var(--acento); color: #0b0f17; font: 800 40px 'Archivo', sans-serif; }
  .fundido { position: absolute; inset: 0; background: #05070b; pointer-events: none; }
  .titular { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; background: radial-gradient(ellipse at center, rgba(3, 5, 9, 0.35) 0%, rgba(3, 5, 9, 0.72) 75%); }
  .titular h1 { margin: 0; font: 800 124px/1.0 'Archivo', sans-serif; letter-spacing: -0.035em; text-shadow: 0 8px 60px rgba(0, 0, 0, 0.9); }
  .titular h1 .ac { color: var(--acento); }
  .titular .kick { font: 600 28px 'IBM Plex Mono', monospace; letter-spacing: 0.12em; text-transform: uppercase; color: var(--acento); margin-bottom: 26px; }
  .titular p { margin: 26px auto 0; max-width: 1300px; font: 400 40px/1.35 'Libre Franklin', sans-serif; color: rgba(242, 239, 232, 0.85); }
</style>
</head>
<body>
<div id="lienzo"></div>
<script>
/* El montaje (window.MONTAJE) lo inyecta render.js: { ancho, alto, duracion, acento, marca, planos:[{t0,t1,tipo,...}], subs:[{t0,t1,texto}] } */
(function () {
  const L = document.getElementById('lienzo');
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, k) => a + (b - a) * k;
  const easeIO = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
  const easeOut = (k) => 1 - Math.pow(1 - k, 3);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // Texto con *palabras* en el color de acento
  const marcado = (t) => esc(t).replace(/\*([^*]+)\*/g, '<span class="ac">$1</span>').replace(/\n/g, '<br>');
  const imgs = {};
  const W = 1920, H = 1080;

  // Encuadre: un rectángulo [x,y,w,h] de la captura (en px de 1920×1080) que ocupa toda la pantalla; se ajusta a 16:9
  const ajustar = (r) => { let [x, y, w, h] = r; const ar = W / H; if (w / h > ar) { const nh = w / ar; y -= (nh - h) / 2; h = nh; } else { const nw = h * ar; x -= (nw - w) / 2; w = nw; } w = Math.min(w, W); h = Math.min(h, H); x = clamp(x, 0, W - w); y = clamp(y, 0, H - h); return [x, y, w, h]; };
  const encoger = (r, f) => { const [x, y, w, h] = r; return [x + w * (1 - f) / 2, y + h * (1 - f) / 2, w * f, h * f]; };

  // Palabras del rótulo: entran escalonadas desde abajo
  function rotulo(texto, tl) {
    const ws = texto.split(/(\s+)/).filter((x) => x.trim());
    let ac = false;
    return `<div class="rotulo-fondo" style="opacity:${clamp(tl / 0.35, 0, 1)}"></div><div class="rotulo">${ws.map((w, i) => {
      const k = easeOut(clamp((tl - 0.15 - i * 0.07) / 0.45, 0, 1));
      let txt = w; const abre = txt.startsWith('*'), cierra = txt.endsWith('*'); txt = txt.replace(/\*/g, ''); if (abre) ac = true; const cls = ac ? 'ac' : ''; if (cierra) ac = false;
      return `<span class="${cls}" style="opacity:${k};transform:translateY(${(1 - k) * 40}px)">${esc(txt)}</span>`;
    }).join('')}</div>`;
  }

  // Dibuja un plano en el instante local tl (segundos desde su inicio)
  function plano(p, tl) {
    const d = p.t1 - p.t0, k = clamp(tl / d, 0, 1);
    if (p.tipo === 'captura' || p.tipo === 'clip') {
      const de = ajustar(p.de || [0, 0, W, H]), a = ajustar(p.a || encoger(de, p.empuje || (p.tipo === 'clip' ? 0.97 : 0.93)));
      const e = p.a ? easeIO(k) : k; // movimiento pedido: con aceleración; deriva por defecto: lineal y lenta
      const r = de.map((v, i) => lerp(v, a[i], e)), s = W / r[2];
      let h = `<div class="capa"><img src="${p.tipo === 'clip' ? fotograma(p, tl) : imgs[p.img].src}" style="transform:scale(${s}) translate(${-r[0]}px,${-r[1]}px)"></div><div class="viñeta"></div>`;
      if (p.resalta) {
        const op = clamp((k - (p.resaltaDesde == null ? 0.3 : p.resaltaDesde)) / 0.12, 0, 1);
        if (op > 0) { const [x, y, w, hh] = p.resalta; h += `<div class="foco" style="opacity:${op};left:${(x - r[0]) * s - 10}px;top:${(y - r[1]) * s - 10}px;width:${w * s + 20}px;height:${hh * s + 20}px"></div>`; }
      }
      if (p.etiqueta) h += `<div class="etiqueta" style="opacity:${clamp(tl / 0.3, 0, 1)}">${esc(p.etiqueta)}</div>`;
      if (p.rotulo) h += rotulo(p.rotulo, tl);
      if (p.titular) { const o = easeOut(clamp((tl - (p.titular.desde || 0.2)) / 0.7, 0, 1)), T = p.titular; h += `<div class="titular" style="opacity:${o}"><div style="transform:translateY(${(1 - o) * 30}px) scale(${1 + 0.025 * k})">${T.kick ? `<div class="kick">${esc(T.kick)}</div>` : ''}<h1>${marcado(T.texto)}</h1>${T.sub ? `<p>${marcado(T.sub)}</p>` : ''}${T.cta ? `<div class="cta" style="opacity:${easeOut(clamp((tl - (T.desde || 0.2) - 0.8) / 0.6, 0, 1))}">${esc(T.cta)}</div>` : ''}</div></div>`; }
      return h;
    }
    if (p.tipo === 'titulo') {
      const o = easeOut(clamp(tl / 0.6, 0, 1)), z = 1 + 0.03 * k;
      return `<div class="tarjeta"><div style="opacity:${o};transform:translateY(${(1 - o) * 30}px) scale(${z})">${p.kick ? `<div class="kick">${esc(p.kick)}</div>` : ''}<h1>${marcado(p.texto)}</h1>${p.sub ? `<p style="opacity:${clamp((tl - 0.5) / 0.5, 0, 1)}">${marcado(p.sub)}</p>` : ''}</div></div>`;
    }
    if (p.tipo === 'cifra') {
      const o1 = easeOut(clamp(tl / 0.4, 0, 1)), o2 = easeOut(clamp((tl - (p.cambio || 0.35) * d) / 0.4, 0, 1));
      return `<div class="tarjeta">${p.kick ? `<div class="kick" style="opacity:${o1}">${esc(p.kick)}</div>` : ''}<div class="cifra"><b class="de" style="opacity:${o1}">${esc(p.de)}</b><span class="fl" style="opacity:${o2}">→</span><b class="a" style="opacity:${o2};transform:scale(${0.85 + 0.15 * o2})">${esc(p.a)}</b></div>${p.pie ? `<p style="opacity:${o1}">${marcado(p.pie)}</p>` : ''}</div>`;
    }
    if (p.tipo === 'cierre') {
      const o = easeOut(clamp(tl / 0.7, 0, 1)), o2 = easeOut(clamp((tl - 0.8) / 0.6, 0, 1));
      return `<div class="tarjeta"><div style="opacity:${o};transform:scale(${0.96 + 0.04 * o})"><h1>${marcado(p.texto)}</h1>${p.sub ? `<p>${marcado(p.sub)}</p>` : ''}${p.cta ? `<div class="cta" style="opacity:${o2};transform:translateY(${(1 - o2) * 20}px)">${esc(p.cta)}</div>` : ''}</div></div>`;
    }
    return '';
  }

  // Clip: el fotograma que toca en el instante local tl. «desde» salta segundos del clip y «velocidad» lo acelera o frena
  function fotograma(p, tl) {
    const c = window.MONTAJE.clips[p.img]; const i = clamp(Math.floor(((p.desde || 0) + tl * (p.velocidad || 1)) * c.fps), 0, c.n - 1);
    return c.base + '/f' + String(i).padStart(4, '0') + '.jpg';
  }

  window.preparar = async () => {
    const M = window.MONTAJE; document.documentElement.style.setProperty('--acento', M.acento || '#c9f24d');
    const ids = [...new Set(M.planos.filter((p) => p.img && p.tipo !== 'clip').map((p) => p.img))];
    await Promise.all(ids.map((id) => new Promise((ok, ko) => { const im = new Image(); im.onload = () => ok(); im.onerror = () => ko(new Error('Falta la captura ' + id)); im.src = M.imagenes[id]; imgs[id] = im; })));
    if (document.fonts) await document.fonts.ready;
    return true;
  };

  // Un fotograma: plano actual, fundido con el anterior si se pidió, marca, subtítulo y fundidos de entrada y salida
  window.seek = (t) => {
    const M = window.MONTAJE, ps = M.planos;
    const i = ps.findIndex((p) => t >= p.t0 && t < p.t1); const p = ps[i >= 0 ? i : ps.length - 1];
    let h = `<div class="velo">${plano(p, t - p.t0)}</div>`;
    const tr = p.transicion === 'fundido' ? 0.45 : 0;
    if (tr && i > 0 && t - p.t0 < tr) { const q = ps[i - 1]; h = `<div class="velo">${plano(q, q.t1 - q.t0)}</div><div class="velo" style="opacity:${easeIO((t - p.t0) / tr)}">${plano(p, t - p.t0)}</div>`; }
    if (M.marca && (p.tipo === 'captura' || p.tipo === 'clip') && !p.titular) h += `<div class="bug">${marcado(M.marca)}</div>`;
    if (M.subtitulos) { const s = M.subs.find((x) => t >= x.t0 && t < x.t1); if (s && (p.tipo === 'captura' || p.tipo === 'clip') && !p.titular) h += `<div class="sub">${esc(s.texto)}</div>`; }
    const fin = M.duracion; const negro = Math.max(clamp(1 - t / 0.5, 0, 1), clamp((t - (fin - 0.6)) / 0.6, 0, 1));
    if (negro > 0) h += `<div class="fundido" style="opacity:${negro}"></div>`;
    L.innerHTML = h;
    // Los fotogramas de un clip cambian en cada instante: se espera a que estén decodificados antes de la captura
    return Promise.all(Array.from(L.querySelectorAll('img')).map((im) => (im.decode ? im.decode().catch(() => {}) : null)));
  };
})();
</script>
</body>
</html>
