<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniCRM - Gestión de clientes</title>
    <link rel="stylesheet" href="crm.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand">
                <span class="brand-logo">◆</span>
                <span class="brand-name">MiniCRM</span>
            </div>
            <nav class="nav">
                <button class="nav-item active" data-view="dashboard">
                    <span class="nav-icon">📊</span> Dashboard
                </button>
                <button class="nav-item" data-view="contacts">
                    <span class="nav-icon">👤</span> Contactos
                </button>
                <button class="nav-item" data-view="companies">
                    <span class="nav-icon">🏢</span> Empresas
                </button>
                <button class="nav-item" data-view="deals">
                    <span class="nav-icon">💼</span> Oportunidades
                </button>
                <button class="nav-item" data-view="tasks">
                    <span class="nav-icon">✅</span> Tareas
                </button>
            </nav>
            <div class="sidebar-footer">
                <button class="btn-secondary btn-block" id="exportBtn">⬇ Exportar datos</button>
                <button class="btn-secondary btn-block" id="importBtn">⬆ Importar datos</button>
                <input type="file" id="importFile" accept="application/json" hidden>
                <button class="btn-danger btn-block" id="resetBtn">🗑 Borrar todo</button>
            </div>
        </aside>

        <main class="main">
            <header class="topbar">
                <h1 id="viewTitle">Dashboard</h1>
                <div class="topbar-actions">
                    <input type="search" id="searchInput" placeholder="Buscar…" class="search-input">
                    <button class="btn-primary" id="newBtn">+ Nuevo</button>
                </div>
            </header>

            <section class="content" id="content"></section>
        </main>
    </div>

    <!-- Modal -->
    <div class="modal-backdrop" id="modal" hidden>
        <div class="modal">
            <header class="modal-header">
                <h2 id="modalTitle">Nuevo</h2>
                <button class="modal-close" id="modalClose">✕</button>
            </header>
            <form id="modalForm" class="modal-form"></form>
        </div>
    </div>

    <div class="toast" id="toast" hidden></div>

    <script src="crm.js"></script>
</body>
</html>
